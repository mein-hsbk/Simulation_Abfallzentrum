{

}

{

const legend = document.getElementById('legend');

// ------------------------------------------------------------------ UI
const TOUR = ['waage', 'sortier', 'bunker', 'kessel', 'rgr', 'kamin', 'ez', 'schlacke', 'kst', 'verg', 'kompost', 'deponie', 'sw', 'verw'];
const SHORT = { waage: 'Waage', sortier: 'Sortierung', bunker: 'Bunker', kessel: 'MVA', rgr: 'RGR', kamin: 'Kamin', ez: 'Energiezentrale', schlacke: 'Schlacke', kst: 'KS-Trocknung', verg: 'Vergärung', kompost: 'Kompost', deponie: 'Deponie DK II', sw: 'SWS-1/SB-1', verw: 'Verwaltung' };
const labelBox = document.getElementById('labels');
for (const id of TOUR) { const el = document.createElement('div'); el.className = 'lbl'; el.textContent = SHORT[id]; el.addEventListener('click', e => { e.stopPropagation(); select(id, true); }); labelBox.appendChild(el); comps[id].el = el; }

const info = document.getElementById('info'), infoBody = document.getElementById('infoBody'), tname = document.getElementById('tname');
let tourIdx = -1, auto = null, fly = null;
function select(id, doFly) {

  if (doFly) {

document.getElementById('bPrev').onclick = () => { stopAuto(); select(TOUR[(tourIdx - 1 + TOUR.length) % TOUR.length], true); };

document.getElementById('bAuto').onclick = e => {

};

let showLbl = true;
document.getElementById('bLbl').onclick = e => { showLbl = !showLbl; e.target.classList.toggle('on', showLbl); labelBox.style.display = showLbl ? '' : 'none'; };
document.getElementById('bFlow').onclick = e => { flowGroup.visible = !flowGroup.visible; e.target.classList.toggle('on', flowGroup.visible); legend.style.display = flowGroup.visible ? 'block' : 'none'; layout(); };
let traffic = true;
document.getElementById('bTraffic').onclick = e => { traffic = !traffic; e.target.classList.toggle('on', traffic); vehicles.forEach(v => v.obj.visible = traffic); };

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);

addEventListener('resize', resize); resize();
camera.position.copy(homePos()); controls.target.copy(homeTgt());

// ------------------------------------------------------------------ Animation
const clock = new THREE.Clock(), pv = new THREE.Vector3(), tmp = { pos: new THREE.Vector3(), dir: new THREE.Vector3() };
let elapsed = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.1); elapsed += dt;
  for (const sp of spinners) sp.obj.rotation.y += sp.w * dt;

    const c = comps[id]; pv.copy(c.anchor).project(camera);
    if (pv.z > 1 || Math.abs(pv.x) > 1.05 || Math.abs(pv.y) > 1.05) { c.el.style.display = 'none'; continue; }
    c.el.style.display = ''; c.el.style.transform = `translate(${(pv.x * .5 + .5) * innerWidth}px,${(-pv.y * .5 + .5) * innerHeight}px) translate(-50%,-100%)`;
  }

}
window.__ka3d = { THREE, scene, renderer, camera, controls };

tick();
